<!doctype html>
<html>
  <head>
    <title>Redirecting...</title>
    <script>
      // 1. Log the hit by incrementing a free counter under your custom group name
      fetch('https://api.counterapi.dev/v1/zealcartbd/qr_counter/up')
        .then(() => {
            // 2. Once recorded, bounce instantly to Facebook
            window.location.href = "https://www.facebook.com/zealcartbd";
        })
        .catch(() => {
            // Fallback: If the tracking service has an issue, still send them to Facebook regardless
            window.location.href = "https://www.facebook.com/zealcartbd";
        });
    </script>
    
    <!-- Fallback meta redirect if the user has JavaScript disabled completely -->
    <meta http-equiv="refresh" content="2; url=https://www.facebook.com/zealcartbd" />
  </head>
  <body>
    <p>
      Redirecting you to Facebook... If you are not redirected automatically, 
      <a href="https://www.facebook.com/zealcartbd">click here</a>.
    </p>
  </body>
</html>

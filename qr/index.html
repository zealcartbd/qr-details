<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        /* Hidden by default so regular users don't see a flash */
        #stats-box {
            display: none; 
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h2 {
            font-size: 3rem;
            color: #1877f2; /* Facebook Blue */
        }
    </style>
</head>
<body>

    <!-- Hidden admin panel -->
    <div id="stats-box">
        <p>Total QR Code Scans / Lands:</p>
        <h2 id="counter-display">0</h2>
    </div>

    <script>
        // Check if the URL has the special stats parameter
        const urlParams = new URLSearchParams(window.location.search);
        const viewStats = urlParams.has('stats');

        // Get the current count from local storage (default to 0 if it doesn't exist yet)
        let currentCount = parseInt(localStorage.getItem('qr_land_count')) || 0;

        if (viewStats) {
            // --- ADMIN MODE: SHOW STATS ---
            document.getElementById('stats-box').style.display = 'block';
            document.title = "Scan Analytics";
            
            // Write the current total count right into the <h2> tag
            document.getElementById('counter-display').innerText = currentCount;
        } else {
            // --- USER MODE: INCREMENT AND REDIRECT ---
            // 1. Add 1 to the current landing count
            currentCount += 1;
            localStorage.setItem('qr_land_count', currentCount);

            // 2. Redirect to Facebook instantly
            window.location.href = "https://www.facebook.com/zealcartbd";
        }
    </script>
</body>
</html>

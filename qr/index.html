<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        /* Hidden by default so regular users redirecting see a clean screen */
        #stats-box {
            display: none; 
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h2 {
            font-size: 3rem;
            color: #1877f2; /* Facebook Blue */
        }
    </style>
</head>
<body>

    <!-- Hidden admin dashboard container -->
    <div id="stats-box">
        <p>Total QR Code Scans / Lands:</p>
        <h2 id="counter-display">Loading...</h2>
    </div>

    <script>
        // Check if the URL has the specific string parameter (e.g. ?stats=true)
        const urlParams = new URLSearchParams(window.location.search);
        const viewStats = urlParams.has('stats');

        // A secure, unique key combining your business name and page objective
        const apiUrl = 'https://abacus.jasoncameron.dev/hit/zealcartbd.com/qr_counter';

        if (viewStats) {
            // --- ADMIN MODE: SHOW CLOUD STATS ---
            document.getElementById('stats-box').style.display = 'block';
            document.title = "Scan Analytics";
            
            // Fetch the active total value without adding an extra numeric point
            // Changing '/hit/' to '/get/' safely views the count without incrementing it
            fetch(apiUrl.replace('/hit/', '/get/'))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('counter-display').innerText = data.value || 0;
                })
                .catch(error => {
                    document.getElementById('counter-display').innerText = "Error pulling data";
                });
        } else {
            // --- USER MODE: INCREMENT IN CLOUD AND REDIRECT ---
            // 1. Send the background fetch to register the visitor click globally
            fetch(apiUrl)
                .then(() => {
                    // 2. Redirect to Facebook immediately once logged
                    window.location.href = "https://www.facebook.com/zealcartbd";
                })
                .catch(() => {
                    // Fallback: If network fluctuates, ensure the user goes to Facebook anyway
                    window.location.href = "https://www.facebook.com/zealcartbd";
                });
        }
    </script>
</body>
</html>

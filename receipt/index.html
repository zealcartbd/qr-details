<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZealCart — Receipt Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      :root {
        --green: #1f9821;
        --green-dark: #166419;
        --green-tint: #eaf6e9;
        --ink: #000000;
        --paper: #ffffff;
        --grey: #6b6b6b;
        --line: #c9c9c9;
        --font-brand: "Georgia", "Times New Roman", serif;
        --font-receipt: "Courier New", Courier, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: #f2f4f2;
        color: var(--ink);
        padding: 32px 16px 80px;
        overflow-x: hidden;
      }
      h1 {
        text-align: center;
        font-size: clamp(16px, 4vw, 20px);
        letter-spacing: 0.06em;
        margin: 0 0 4px;
      }
      h1 span {
        color: var(--green);
      }
      .subtitle {
        text-align: center;
        color: var(--grey);
        font-size: 13px;
        margin: 0 0 28px;
        padding: 0 8px;
      }
      .layout {
        display: flex;
        gap: 32px;
        max-width: 980px;
        margin: 0 auto;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }
 
      /* ---------- FORM PANEL ---------- */
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px 24px 26px;
        width: 100%;
        max-width: 360px;
        flex: 1 1 320px;
      }
      .panel h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--green-dark);
        margin: 0 0 16px;
        border-bottom: 2px solid var(--green);
        padding-bottom: 8px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #333;
      }
      .field input[type="text"],
      .field input[type="number"],
      .field textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 16px; /* 16px prevents iOS Safari auto-zoom on focus */
        font-family: inherit;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 2px var(--green-tint);
      }
      .row2 {
        display: flex;
        gap: 10px;
      }
      .row2 .field {
        flex: 1;
        min-width: 0; /* lets inputs shrink instead of overflowing */
      }
      .field-file {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .field-file input {
        font-size: 12px;
      }
      .thumb {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--line);
        object-fit: cover;
        display: none;
      }
      .divider {
        border: none;
        border-top: 1px dashed var(--line);
        margin: 18px 0;
      }
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn-primary {
        background: var(--green);
        color: #fff;
        margin-bottom: 10px;
      }
      .btn-primary:hover {
        background: var(--green-dark);
      }
      .btn-secondary {
        background: var(--ink);
        color: #fff;
      }
      .btn-secondary:hover {
        opacity: 0.85;
      }
      .hint {
        font-size: 11px;
        color: var(--grey);
        margin-top: 6px;
        line-height: 1.4;
      }
 
      /* ---------- RECEIPT PANEL ---------- */
      .receipt-stage {
        flex: 0 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 100%;
      }
      #receipt {
        width: min(3in, 92vw);
        min-height: 5in;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-receipt);
        position: relative;
        padding: 14px 14px 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: solid 1px #0000003b;
      }
      /* torn / scalloped bottom edge */
      #receipt::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 10px;
        background: radial-gradient(
            circle at 6px 0,
            transparent 6px,
            var(--paper) 6.5px
          )
          repeat-x;
        background-size: 12px 12px;
        background-position: 0 -1px;
      }
      .r-logo-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      #logoImg {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
        border: 1px solid var(--ink);
      }
      .r-brand {
        text-align: center;
        font-family: var(--font-brand);
        font-weight: bold;
        font-size: 22px;
        letter-spacing: 0.03em;
        color: var(--green);
        line-height: 1.1;
      }
      .r-tagline {
        text-align: center;
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--grey);
        margin-top: 1px;
      }
      .r-dash {
        border: none;
        border-top: 1.4px dashed var(--ink);
        margin: 8px 0;
      }
      .r-meta {
        font-size: 11px;
        line-height: 1.65;
      }
      .r-meta .r-line {
        display: flex;
      }
      .r-meta .r-label {
        width: 92px;
        flex: 0 0 92px;
        color: var(--grey);
      }
      .r-meta .r-value {
        flex: 1;
        font-weight: bold;
        word-break: break-word;
      }
      .r-section-title {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--green-dark);
        font-weight: bold;
        margin-bottom: 4px;
      }
      .r-item {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        padding: 3px 0;
      }
      .r-item .name {
        flex: 1;
        padding-right: 6px;
      }
      .r-item .price {
        font-weight: bold;
        white-space: nowrap;
      }
      .r-total {
        display: flex;
        justify-content: space-between;
        font-size: 13.5px;
        font-weight: bold;
        background: var(--green-tint);
        padding: 6px 8px;
        border-radius: 4px;
        margin-top: 4px;
        color: var(--green-dark);
      }
      .r-thanks {
        text-align: center;
        font-family: var(--font-brand);
        font-style: italic;
        font-size: 12.5px;
        color: var(--ink);
        margin: 10px 0 6px;
        line-height: 1.35;
        margin-top: 25px;
      }
      .r-bottom {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        margin-top: 20px;
      }
      #z-qrcode {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        padding: 2px;
        background: #fff;
      }
      #z-qrcode img {
        width: 100% !important;
        height: 100% !important;
      }
      .r-footer-text {
        font-size: 15px;
        color: var(--grey);
        line-height: 1.2;
        text-align: right;
      }
      .r-footer-text b {
        color: var(--ink);
      }
 
      .preview-note {
        font-size: 11px;
        color: #888;
        text-align: center;
        padding: 0 8px;
      }
 
      /* ---------- PASSWORD GATE ---------- */
      #passGate {
        position: fixed;
        inset: 0;
        background: #10130f;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }
      #passCard {
        background: var(--paper);
        border-radius: 12px;
        padding: 32px 28px;
        width: 100%;
        max-width: 320px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      #passLogo {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-family: var(--font-brand);
        font-weight: bold;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
      }
      #passCard h2 {
        font-size: 16px;
        margin: 0 0 6px;
        color: var(--ink);
      }
      #passCard p {
        font-size: 12.5px;
        color: var(--grey);
        margin: 0 0 16px;
      }
      #passInput {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 16px;
        margin-bottom: 12px;
        text-align: center;
        letter-spacing: 0.08em;
      }
      #passInput:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 2px var(--green-tint);
      }
      #passError {
        display: none;
        color: #c0392b;
        font-size: 12px;
        margin: 12px 0 0;
      }
      #passWorking {
        display: none;
        color: var(--grey);
        font-size: 12px;
        margin: 12px 0 0;
      }
 
      /* ---------- RESPONSIVE ADJUSTMENTS ---------- */
      @media (max-width: 700px) {
        .layout {
          gap: 20px;
        }
        body {
          padding: 20px 12px 60px;
        }
      }
 
      @media (max-width: 480px) {
        .row2 {
          flex-direction: column;
          gap: 0;
        }
        .panel {
          padding: 18px 16px 20px;
        }
        .subtitle {
          font-size: 12px;
        }
      }
 
      @media print {
        body * {
          visibility: hidden;
        }
        #receipt,
        #receipt * {
          visibility: visible;
        }
        #receipt {
          position: fixed;
          top: 0;
          left: 0;
          width: 3in;
          box-shadow: none;
        }
        @page {
          size: 3in 5in;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- PASSWORD GATE: nothing below is fetched or rendered until this succeeds.
         The receipt tool markup is AES-256-GCM encrypted and only exists in
         plaintext in this browser's memory after a correct decrypt. -->
    <div id="passGate">
      <div id="passCard">
        <div id="passLogo">ZC</div>
        <h2>ZealCart Receipt Tool</h2>
        <p>Enter the access password to continue.</p>
        <input
          type="password"
          id="passInput"
          autocomplete="off"
          placeholder="Password"
        />
        <button id="passSubmit" class="btn btn-primary">Unlock</button>
        <p id="passError">Incorrect password. Please try again.</p>
        <p id="passWorking">Checking…</p>
      </div>
    </div>

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
 
      async function deriveKey(password, saltBytes) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: ENC_ITERATIONS,
            hash: "SHA-256",
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
      }
 
      async function tryUnlock(password) {
        const passError = document.getElementById("passError");
        const passWorking = document.getElementById("passWorking");
        passError.style.display = "none";
        passWorking.style.display = "block";
 
        try {
          const salt = b64ToBytes(ENC_SALT_B64);
          const iv = b64ToBytes(ENC_IV_B64);
          const data = b64ToBytes(ENC_DATA_B64);
          const key = await deriveKey(password, salt);
          const plainBuf = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv },
            key,
            data,
          );
          const html = new TextDecoder().decode(plainBuf);
 
          const appRoot = document.getElementById("appRoot");
          appRoot.innerHTML = html;
          appRoot.style.display = "";
          document.getElementById("passGate").remove();
          initApp();
        } catch (err) {
          // AES-GCM authentication fails on any wrong password —
          // this is the actual gate, not a string comparison.
          passWorking.style.display = "none";
          passError.style.display = "block";
          document.getElementById("passInput").value = "";
          document.getElementById("passInput").focus();
        }
      }
 
      document.getElementById("passSubmit").addEventListener("click", () => {
        const pw = document.getElementById("passInput").value;
        if (pw) tryUnlock(pw);
      });
      document.getElementById("passInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("passSubmit").click();
      });
      document.getElementById("passInput").focus();
 
      /* ============================================================
         RECEIPT TOOL LOGIC
         (runs only after initApp() is called post-unlock)
         ============================================================ */
      function fmtMoney(cur, num) {
        const n = Number(num) || 0;
        return cur + n.toLocaleString("en-US");
      }
 
      function todayStr() {
        const d = new Date();
        const opts = { year: "numeric", month: "short", day: "2-digit" };
        return d.toLocaleDateString("en-US", opts);
      }
 
      function generate() {
        const orderId = document.getElementById("orderId").value.trim() || "—";
        const custName =
          document.getElementById("custName").value.trim() || "—";
        const contact = document.getElementById("contact").value.trim() || "—";
        const date =
          document.getElementById("orderDate").value.trim() || todayStr();
        const address = document.getElementById("address").value.trim() || "—";
        const productName =
          document.getElementById("productName").value.trim() || "—";
        const currency =
          document.getElementById("currency").value.trim() || "৳";
        const price = document.getElementById("price").value;
        const deliveryFee =
          Number(document.getElementById("deliveryFee").value) || 0;
        const thanks =
          document.getElementById("thanksMsg").value.trim() ||
          "Thank you for your order!";
 
        document.getElementById("rOrderId").textContent = orderId;
        document.getElementById("rDate").textContent = date;
        document.getElementById("rCustName").textContent = custName;
        document.getElementById("rContact").textContent = contact;
        document.getElementById("rAddress").textContent = address;
        document.getElementById("rProductName").textContent = productName;
        document.getElementById("rPrice").textContent = fmtMoney(
          currency,
          price,
        );
        document.getElementById("rDelivery").textContent =
          deliveryFee > 0 ? fmtMoney(currency, deliveryFee) : "FREE";
        document.getElementById("rTotal").textContent = fmtMoney(
          currency,
          Number(price || 0) + deliveryFee,
        );
        document.getElementById("rThanks").textContent = thanks;
      }
 
      function initApp() {
        document.getElementById("orderDate").value = todayStr();
 
        document
          .getElementById("generateBtn")
          .addEventListener("click", generate);
 
        document
          .getElementById("printBtn")
          .addEventListener("click", function () {
            window.print();
          });
 
        document
          .getElementById("downloadBtn")
          .addEventListener("click", async function () {
            const btn = this;
 
            if (typeof html2canvas === "undefined") {
              alert(
                'The image export library could not load (often caused by an ad-blocker/privacy extension blocking scripts from cdnjs.cloudflare.com, or no internet connection). Please allow cdnjs.cloudflare.com and try again, or use "Print Receipt" → Save as PDF instead.',
              );
              return;
            }
 
            const originalLabel = btn.textContent;
            btn.textContent = "Preparing image…";
            btn.disabled = true;
 
            try {
              // brief pause so images/layout are fully painted before capture
              await new Promise((resolve) => setTimeout(resolve, 200));
 
              const canvas = await html2canvas(
                document.getElementById("receipt"),
                {
                  scale: 4,
                  backgroundColor: "#ffffff",
                  useCORS: true,
                  logging: false,
                },
              );
 
              const orderId =
                document.getElementById("orderId").value.trim() || "receipt";
              const link = document.createElement("a");
              link.download = "zealcart-receipt-" + orderId + ".png";
              link.href = canvas.toDataURL("image/png");
              document.body.appendChild(link);
              link.click();
              link.remove();
            } catch (err) {
              console.error("PNG export failed:", err);
              alert(
                'Sorry, the PNG export failed in this browser. Please use "Print Receipt" and choose "Save as PDF" (or "Save as Image") from the print dialog instead.',
              );
            } finally {
              btn.textContent = originalLabel;
              btn.disabled = false;
            }
          });
 
        // initial render
        generate();
      }
    </script>
